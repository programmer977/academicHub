name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and Build

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: academichub
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: academichub_test

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U academichub -d academichub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://academichub:dev_password@127.0.0.1:5433/academichub_test
      TEST_DATABASE_URL: postgresql://academichub:dev_password@127.0.0.1:5433/academichub_test
      JWT_SECRET: integration-test-secret-with-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Apply database migrations
        run: npm run migrate -- up

      - name: Run integration tests
        run: npm run test:integration

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm --prefix web run build

      - name: Build Docker image
        run: docker build -t academichub:ci .