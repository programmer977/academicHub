<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AcademicHub</title>
</head>

<body>
  <main>
    <header>
      <h1>AcademicHub</h1>

      <p>
        Gerenciamento acadêmico pessoal
      </p>
    </header>

    <section aria-labelledby="login-title">
      <h2 id="login-title">Entrar</h2>

      <form id="login-form">
        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">
          Senha
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          Entrar
        </button>
      </form>
    </section>

    <section aria-labelledby="subjects-title">
      <h2 id="subjects-title">
        Minhas disciplinas
      </h2>

      <form id="subject-form">
        <label for="subject-name">
          Nome da disciplina
        </label>

        <input
          id="subject-name"
          name="name"
          required
        >

        <button type="submit">
          Adicionar disciplina
        </button>
      </form>

      <ul id="subjects-list"></ul>
    </section>

    <p
      id="feedback"
      role="status"
      aria-live="polite"
    ></p>
  </main>

  <script
    type="module"
    src="/src/main.ts"
  ></script>
</body>
</html>
