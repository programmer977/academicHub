services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: academichub
      POSTGRES_PASSWORD: 'devPass'
      POSTGRES_DB: academichub

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U academichub -d academichub
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: